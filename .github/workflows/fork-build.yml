# Fork-only CI: x64 debug unit tests and a downloadable x64 release exe.
# The upstream build.yml (-ci mode) only covers the Win32 build on this fork
# and keeps no artifacts.
name: fork-build
on:
  push:
    branches: ["claude/**"]
    # a version tag also publishes a GitHub Release, see the release job
    tags: ["bilingual-v*"]
    # doc-only pushes don't need a 40 minute Windows build
    paths-ignore: ["docs/**", "spike/**", "**.md"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # a newer push to the same branch supersedes the running build
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows x64 debug tests + release
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    steps:
      - name: Check out source code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # needed to calc build number via git log --oneline
          fetch-depth: 0
          persist-credentials: false

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # builds out/dbg64/SumatraPDF.exe and runs its -unit-tests;
      # output is captured in out/dbg64/unit-tests-dbg.txt
      - name: Debug build + unit tests
        run: bun cmd/run-unit-tests.ts -dbg

      - name: Release build
        run: bun cmd/build.ts -rel

      # libsumatrapdf.dll and the other helpers are embedded in the exe
      - name: Upload release exe
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: SumatraPDF-rel64-${{ github.sha }}
          path: out/rel64/SumatraPDF.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unit-tests-log
          path: out/dbg64/unit-tests-dbg.txt
          if-no-files-found: ignore
          retention-days: 7

  # Publishes the exe built above as a public GitHub Release (no login
  # needed to download). Runs only for bilingual-v* tags.
  release:
    name: Publish GitHub Release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/bilingual-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download release exe
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: SumatraPDF-rel64-${{ github.sha }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          asset="SumatraPDF-Bilingual-${TAG#bilingual-}-64.exe"
          mv SumatraPDF.exe "$asset"
          gh release create "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" \
            --title "SumatraPDF 中英對照版 ${TAG#bilingual-}" \
            --notes-file .github/release-notes.md
